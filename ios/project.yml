name: Skillego
options:
  bundleIdPrefix: app.crisiscontrol
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Skillego:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Skillego
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.crisiscontrol.skillego
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Skillego
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    preBuildScripts:
      - name: Bundle reused JS engine + assets
        script: |
          "${SRCROOT}/scripts/copy-js-engine.sh"
        inputFiles:
          - "$(SRCROOT)/../js/no-modules/constants.js"
          - "$(SRCROOT)/../js/no-modules/state.js"
          - "$(SRCROOT)/../js/no-modules/rules.js"
          - "$(SRCROOT)/../js/no-modules/ai-learning.js"
          - "$(SRCROOT)/../js/no-modules/minimax.js"
          - "$(SRCROOT)/../js/no-modules/classic-ai.js"
          - "$(SRCROOT)/../js/no-modules/gamelog.js"
          - "$(SRCROOT)/../js/no-modules/board.js"
          - "$(SRCROOT)/Skillego/JSBridge/bridge.js"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/JSEngine/bridge.js"

  SkillegoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SkillegoTests
    dependencies:
      - target: Skillego
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.crisiscontrol.skillego.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Skillego.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Skillego"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Skillego:
    build:
      targets:
        Skillego: all
        SkillegoTests: [test]
    test:
      targets:
        - SkillegoTests
    run:
      config: Debug

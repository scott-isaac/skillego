name: Deploy dev branch preview

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Inject multiplayer server config
        if: ${{ vars.SKILLEGO_SERVER != '' }}
        run: |
          echo "var SKILLEGO_SERVER = \"${{ vars.SKILLEGO_SERVER }}\";" \
            > js/no-modules/server-config.js
          # Remove from .gitignore so peaceiris will include it in the deploy
          sed -i '/server-config\.js/d' .gitignore

      - name: Deploy dev to /dev subfolder on gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          destination_dir: dev
          exclude_assets: '.github,node_modules,gamelogs,training'
          keep_files: true
